# Local / single-server deployment. For production put the API and portal behind HTTPS
# (e.g. Caddy or an AWS/Azure load balancer in the UAE region) and use strong secrets.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: hrms
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://hrms:${DB_PASSWORD}@db:5432/hrms?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${PORTAL_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
    volumes: [uploads:/app/uploads]
    ports: ["4000:4000"]

  portal:
    build:
      context: ./admin-portal
      args: { NEXT_PUBLIC_API_URL: "${API_PUBLIC_URL:-http://localhost:4000}" }
    restart: unless-stopped
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  dbdata:
  uploads:
